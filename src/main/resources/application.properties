vaadin.launch-browser=true
spring.application.name=chatdocs
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Slightly above app.max-upload-size so our own friendly size check runs first.
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=21MB

app.storage-dir=./data/uploads
app.max-upload-size=20MB
app.ingestion.chunk-size=500

# @Async ingestion (and web requests) run on virtual threads.
spring.threads.virtual.enabled=true

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
# gemini-2.5-flash is closed to new API keys (404 as of Sept 2026).
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.2
# 768 dims is fixed: the vector_store column (Phase 9) is vector(768). Changing it needs a migration + re-ingest.
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# Flyway creates vector_store (V4); Spring AI only checks that it matches.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

