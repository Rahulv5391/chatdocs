# Production settings, active with SPRING_PROFILES_ACTIVE=prod (the Docker image sets it). Demo users are not created.

# Neon (or any PostgreSQL with pgvector). Use the direct, non-pooled URL: Flyway needs session features that
# PgBouncer's transaction mode doesn't support, and the app pools its own connections.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Let an idle database scale to zero (Neon's free plan has 100 compute hours a month): close idle connections
# after a minute and don't send keep-alive queries. (Times in milliseconds.)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

# Behind the platform's HTTPS proxy: trust X-Forwarded-* so redirects and cookies use https.
server.forward-headers-strategy=framework
